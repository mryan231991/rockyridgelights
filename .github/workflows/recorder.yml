name: Record song requests

on:
  schedule:
    # Hourly from 20:07 to 03:07 UTC = 3:07 PM to 10:07 PM EST, every day Sep–Jan.
    # GitHub often starts scheduled runs hours late, so several tries cover the show. The concurrency
    # group below keeps one run at a time; a run that finds the night already over exits right away.
    - cron: '7 20-23 * 9-12,1 *'
    - cron: '7 0-3 * 9-12,1 *'
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'How many hours to record (max 5.6)'
        default: '5.6'

permissions:
  contents: write

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record until the show ends
        run: node scripts/recorder.mjs
        env:
          MAX_HOURS: ${{ github.event.inputs.max_hours || '5.6' }}
