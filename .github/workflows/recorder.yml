name: Record song requests

on:
  # Schedule turned off: the FPP plugin (mryan231991/fpp-plugin-rrl-recorder) records the show now.
  # This workflow is a manual backup only (Actions -> Record song requests -> Run workflow).
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'How many hours to record (max 5.6)'
        default: '5.6'

permissions:
  contents: write

concurrency:
  group: recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record until the show ends
        run: node scripts/recorder.mjs
        env:
          MAX_HOURS: ${{ github.event.inputs.max_hours || '5.6' }}
